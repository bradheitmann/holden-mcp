code_discriminators:
- pair: A-6 vs X-5
  discriminator: A-6 means control existed and was actively removed; X-5 means the
    control path was never built.
- pair: A-5 vs S-6
  discriminator: A-5 is the manipulative interface tactic; S-6 is the systemic incentive
    misalignment that makes such tactics likely.
- pair: AG-8 vs AG-18
  discriminator: AG-8 means the model literally cannot do the task; AG-18 means it
    could if the system accommodated it.
- pair: C-2 vs C-3
  discriminator: C-2 is a wrong cause for one event; C-3 is a persistent wrong model
    of the system.
- pair: AG-11 vs AG-17
  discriminator: AG-11 is unconscious proxy optimization; AG-17 is deliberate eval
    gaming.
- pair: X-4 vs AG-20
  discriminator: X-4 means the approval boundary does not exist at all; AG-20 means
    it exists but is not machine-legible.
- pair: X-6 vs AG-19
  discriminator: X-6 means provenance is not tracked or exposed anywhere; AG-19 means
    provenance exists but is not visible to agents.
- pair: A-7 vs AG-18
  discriminator: A-7 is technically valid but gratuitously hostile packaging; AG-18
    is failure to provide the structure an agent needs to participate.
- pair: A-7 vs C-4
  discriminator: A-7 is hostility as the primary harm; C-4 is overload as the primary
    harm.
- pair: F-6 vs AG-15
  discriminator: F-6 means the system appeared to succeed while crossing a boundary;
    AG-15 means the agent crossed a clearly legible boundary.
requirements:
  yaml_safety: single document, no anchors, no aliases, no custom tags, no duplicate
    keys, UTF-8 only
  registry_truth_rule: fields named mandatory in the specification must exist in the
    registry
  core_invocation_rule: core_invocation requires product_class_config; exploratory_invocation
    may infer a temporary default but must record it in evaluation_batch
  mirror_reference_rule: scenario.mirror_reference is optional and used when a meaningful
    mirror target exists
  builder_adapter_rule: builder_packet is orchestration-neutral; rendered_work_order
    is adapter output
