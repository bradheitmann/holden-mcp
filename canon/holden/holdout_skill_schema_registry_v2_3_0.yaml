registry_meta:
  name: holdout_skill_schema_registry
  version: 2.3.0
  status: canonical
  source: holdout_skill_spec_v2_3_0.md
  notes:
  - Single source of truth for artifact schemas, input schemas, enum definitions,
    taxonomy codes, gate names, and discriminator rules
  - Rendered as YAML for portability; teams may materialize equivalent JSON Schema
    or other registry formats
  - Nested object schemas are normative in this version; top-level required-field
    inventories alone are insufficient
  - "Optional (REQ-123, SHOULD). evidence_refs entries should be content-pinned
    as 'sha256:<64hex>:<ref>' so cited evidence cannot be swapped after the
    fact; a plain unpinned ref remains legal for genuinely ephemeral evidence
    when it carries an inline '# unpinned: <reason>' comment."
