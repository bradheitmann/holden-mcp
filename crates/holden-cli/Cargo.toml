[package]
name = "holden-cli"
description = "The holden command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "PolyForm-Noncommercial-1.0.0"
publish.workspace = true

[[bin]]
name = "holden"
path = "src/main.rs"

[dependencies]
hex.workspace = true
holden-canon.workspace = true
holden-embed.workspace = true
holden-eval.workspace = true
holden-ledger.workspace = true
holden-mcp.workspace = true
holden-seal.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
rusqlite.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
