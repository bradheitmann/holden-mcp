[package]
name = "holden-mcp"
description = "The holden MCP server: moment-of-test parameter reveal with peer-credential roles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "PolyForm-Noncommercial-1.0.0"
publish.workspace = true

[[bin]]
name = "holden-mcp"
path = "src/main.rs"

[dependencies]
hex.workspace = true
holden-eval.workspace = true
holden-gen.workspace = true
holden-ledger.workspace = true
holden-seal.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
holden-seal = { workspace = true, features = ["keychain"] }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
schnorrkel.workspace = true

[lints]
workspace = true
