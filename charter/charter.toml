#:schema ../schemas/charter-toml.schema.json
charter_version = "1"
spec_version = "1"
project = "holden-mcp"
owner = "the repository owner"
# The tiniest end-to-end live run that must be green before anything scales.
[slice_zero]
description = "On macOS and on a Linux VM (no Docker): the workspace builds, both canons verify byte-for-byte against their pinned manifests, and a sealed plan's moment-of-test parameters are drawn and verified through a real VRF round trip."
command = "cargo xtask gate slice-0"
proven_on = "2026-11-04"        # ISO date when it last ran green on real infrastructure, else empty
# Verification is a loop: budget it.
[verification_budget]
qa_attempts_per_slice = 3
repair_cycles_per_slice = 1
review_families_required = 2   # author and verifier from different model families
